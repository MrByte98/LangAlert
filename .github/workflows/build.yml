name: Build Multiplatform Binaries

on:
  push:
    branches: [ master, main, release ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main, release ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: LangAlert-Windows
          - os: ubuntu-latest
            artifact_name: LangAlert-Linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux System Dependencies (Qt & X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libgl1-mesa-glx \
            libasound2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Executables on Windows
        if: runner.os == 'Windows'
        run: |
          python build_standalone.py
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            & iscc installer.iss
          }

      - name: Build Packages on Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/LangAlert.exe
            dist/LangAlert-Setup*.exe
          retention-days: 30

      - name: Upload Linux Artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/packages/*.deb
            dist/packages/*.tar.gz
          retention-days: 30
