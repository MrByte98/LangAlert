name: Build Multiplatform Binaries

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: LangAlert-Windows-x64
            archive_name: LangAlert-windows-x64.zip
          - os: ubuntu-latest
            artifact_name: LangAlert-Linux-x64
            archive_name: LangAlert-linux-x86_64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux System Dependencies (Qt & X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libgl1-mesa-glx \
            libasound2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable on Windows
        if: runner.os == 'Windows'
        run: |
          python build_standalone.py
          Compress-Archive -Path dist/LangAlert -DestinationPath dist/LangAlert-windows-x64.zip

      - name: Build Executable on Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.archive_name }}
          retention-days: 30
